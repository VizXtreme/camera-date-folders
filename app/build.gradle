plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def gitVersionProvider = providers.exec {
    commandLine "git", "show", "--no-patch", "--format=%ai"
}
def getVersionDate = { ->
    return gitVersionProvider.standardOutput.asText.get().trim()
}

android {
    defaultConfig {
        applicationId "de.kromke.andreas.cameradatefolders"
        namespace "de.kromke.andreas.cameradatefolders"
        buildConfigField "String", "GIT_TIMESTAMP", "\"$getVersionDate\""
        minSdk 24
        compileSdk = 36
        targetSdk = 36
        versionCode 12
        versionName "1.5.2"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [managePermission:"android.permission.MANAGE_EXTERNAL_STORAGE"]
    }

    buildTypes {
        release_dbg {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }

        release_play {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-remove-log.pro'
            manifestPlaceholders = [managePermission:"android.permission.WRITE_EXTERNAL_STORAGE"]
            signingConfig signingConfigs.debug
        }

        debug_play {
            debuggable true
            signingConfig signingConfigs.debug
            manifestPlaceholders = [managePermission:"android.permission.WRITE_EXTERNAL_STORAGE"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Material 3 Expressive
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended'

    // Lifecycle & Activity
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.8'

    // Core & Support
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
