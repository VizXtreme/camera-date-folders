plugins {
    id 'com.android.application'
}

//
// Define a function to retrieve the latest git commit date.
// Attention: This functionality needs the build cache to be deactivated in gradle.properties:
//  org.gradle.configuration-cache=false
//
def gitVersionProvider = providers.exec {
    commandLine "git", "show", "--no-patch", "--format=%ai"
}
def getVersionDate = { ->
    return gitVersionProvider.standardOutput.asText.get().trim()
}

